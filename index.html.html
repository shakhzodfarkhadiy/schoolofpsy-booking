<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>School of PSY — Бронирование</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#EDECEA;
    --ink:#1A1A1A;
    --ink2:#555;
    --card:#fff;
    --border:#D8D5D2;
    --accent:#1A1A1A;
    --accent-fg:#fff;
    --danger:#C0392B;
    --ok:#27AE60;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;
    padding-bottom:90px;
    min-height:100vh;
  }

  /* HEADER */
  .hd{
    padding:20px 18px 14px;
    border-bottom:2px solid var(--ink);
    display:flex;align-items:center;gap:14px;
  }
  .logo-block{
    display:flex;align-items:stretch;gap:0;
  }
  .logo-school{
    background:var(--ink);color:var(--accent-fg);
    font-size:9px;font-weight:900;letter-spacing:0.1em;
    text-transform:uppercase;writing-mode:vertical-rl;
    text-orientation:mixed;transform:rotate(180deg);
    padding:6px 5px;line-height:1;
  }
  .logo-sep{width:2px;background:var(--ink);}
  .logo-of{
    font-size:11px;font-weight:700;font-style:italic;
    padding:4px 4px;align-self:flex-start;
  }
  .logo-psy{
    font-size:28px;font-weight:900;letter-spacing:-0.02em;
    line-height:1;padding:2px 0;
  }
  .hd-sub{
    font-size:11px;color:var(--ink2);
    letter-spacing:0.05em;text-transform:uppercase;
    margin-top:2px;
  }

  /* PROGRESS */
  .prog{display:flex;gap:5px;padding:14px 18px 0;}
  .prog-dot{
    flex:1;height:3px;border-radius:2px;
    background:var(--border);transition:background .3s;
  }
  .prog-dot.on{background:var(--ink);}
  .prog-dot.done{background:var(--ok);}

  /* PAGE */
  .pg{display:none;padding:18px;}
  .pg.on{display:block;}
  .pg-label{
    font-size:11px;font-weight:700;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--ink2);margin-bottom:14px;
  }

  /* ROOM CARDS */
  .room-card{
    border:2px solid var(--border);border-radius:4px;
    padding:14px 16px;margin-bottom:10px;
    cursor:pointer;display:flex;align-items:center;gap:12px;
    background:var(--card);transition:border-color .15s,background .15s;
  }
  .room-card:active{opacity:.8;}
  .room-card.sel{border-color:var(--ink);background:var(--ink);}
  .room-card.sel .room-name,.room-card.sel .room-type,.room-card.sel .room-dot{color:var(--accent-fg)!important;}
  .room-card.sel .room-check{background:var(--accent-fg);color:var(--ink);}
  .room-num{
    font-size:28px;font-weight:900;line-height:1;
    min-width:36px;color:var(--ink);
  }
  .room-info{flex:1;}
  .room-name{font-weight:700;font-size:15px;}
  .room-type{font-size:12px;color:var(--ink2);margin-top:2px;}
  .room-dot{
    font-size:11px;font-weight:700;margin-top:4px;
  }
  .room-dot.free{color:var(--ok);}
  .room-dot.busy{color:var(--danger);}
  .room-check{
    width:22px;height:22px;border:2px solid var(--border);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;
    transition:all .15s;
  }

  /* CALENDAR */
  .month-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .month-nav button{
    background:none;border:2px solid var(--border);
    border-radius:4px;width:36px;height:36px;
    font-size:18px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:hover{background:var(--border);}
  .month-title{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-lbl{
    text-align:center;font-size:10px;font-weight:700;
    color:var(--ink2);letter-spacing:0.05em;text-transform:uppercase;
    padding:4px 0;
  }
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:4px;font-size:13px;cursor:pointer;
    transition:background .12s;
  }
  .cal-day:hover:not(.empty):not(.past){background:var(--border);}
  .cal-day.empty,.cal-day.past{opacity:.25;pointer-events:none;}
  .cal-day.today{font-weight:800;color:var(--ink);border:2px solid var(--ink);}
  .cal-day.sel{background:var(--ink);color:var(--accent-fg);font-weight:700;}

  /* TIME */
  .time-row{display:flex;gap:10px;margin-bottom:14px;}
  .tf{flex:1;}
  .tf label{
    display:block;font-size:11px;font-weight:700;
    letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink2);margin-bottom:6px;
  }
  .tf input{
    width:100%;border:2px solid var(--border);border-radius:4px;
    padding:14px 10px;font-size:24px;font-weight:900;
    text-align:center;background:var(--card);color:var(--ink);
    outline:none;transition:border-color .15s;
    font-family:inherit;
  }
  .tf input:focus{border-color:var(--ink);}

  /* PURPOSE */
  textarea{
    width:100%;border:2px solid var(--border);border-radius:4px;
    padding:14px 16px;font-size:15px;background:var(--card);
    color:var(--ink);outline:none;resize:none;min-height:80px;
    font-family:inherit;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--ink);}
  .hint{font-size:12px;color:var(--ink2);margin-top:6px;}

  /* SUMMARY */
  .sum-card{
    border:2px solid var(--ink);border-radius:4px;
    background:var(--card);margin-bottom:14px;overflow:hidden;
  }
  .sum-header{
    background:var(--ink);color:var(--accent-fg);
    padding:12px 16px;font-weight:800;font-size:13px;
    letter-spacing:0.08em;text-transform:uppercase;
  }
  .sum-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--border);
  }
  .sum-row:last-child{border-bottom:none;}
  .sum-ico{font-size:18px;flex-shrink:0;width:24px;text-align:center;}
  .sum-lbl{font-size:11px;color:var(--ink2);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.05em;}
  .sum-val{font-weight:700;font-size:15px;}

  /* ERROR */
  .err{
    background:rgba(192,57,43,.1);color:var(--danger);
    border:1px solid rgba(192,57,43,.3);border-radius:4px;
    padding:12px 14px;font-size:13px;margin-bottom:12px;display:none;
  }
  .err.on{display:block;}

  /* BOTTOM */
  .bar{
    position:fixed;bottom:0;left:0;right:0;
    padding:10px 14px;background:var(--bg);
    border-top:2px solid var(--ink);
    display:flex;gap:8px;
  }
  .btn{
    flex:1;padding:15px;border:none;border-radius:4px;
    font-size:15px;font-weight:800;cursor:pointer;
    letter-spacing:0.02em;transition:opacity .15s,transform .1s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.97);}
  .btn-p{background:var(--ink);color:var(--accent-fg);}
  .btn-s{
    background:none;border:2px solid var(--ink);
    color:var(--ink);flex:0 0 auto;padding:15px 20px;
  }
  .btn:disabled{opacity:.35;pointer-events:none;}
</style>
</head>
<body>

<div class="hd">
  <div class="logo-block">
    <div class="logo-school">SCHOOL</div>
    <div class="logo-sep"></div>
    <div>
      <span class="logo-of">of</span>
      <div class="logo-psy">PSY</div>
    </div>
  </div>
  <div>
    <div style="font-weight:800;font-size:16px;">Бронирование</div>
    <div class="hd-sub">9:00 – 20:00</div>
  </div>
</div>

<div class="prog">
  <div class="prog-dot on"  id="d0"></div>
  <div class="prog-dot"     id="d1"></div>
  <div class="prog-dot"     id="d2"></div>
  <div class="prog-dot"     id="d3"></div>
</div>

<!-- STEP 0: ROOM -->
<div class="pg on" id="pg0">
  <div class="pg-label">Шаг 1 — Комната</div>
  <div id="roomList">
    <div style="text-align:center;padding:30px;color:var(--ink2)">Загрузка...</div>
  </div>
</div>

<!-- STEP 1: DATE -->
<div class="pg" id="pg1">
  <div class="pg-label">Шаг 2 — Дата</div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal" id="cal"></div>
</div>

<!-- STEP 2: TIME -->
<div class="pg" id="pg2">
  <div class="pg-label">Шаг 3 — Время</div>
  <div class="err" id="timeErr"></div>
  <div class="time-row">
    <div class="tf">
      <label>Начало</label>
      <input type="time" id="tStart" min="09:00" max="20:00" value="09:00"/>
    </div>
    <div class="tf">
      <label>Конец</label>
      <input type="time" id="tEnd"   min="09:00" max="20:00" value="10:00"/>
    </div>
  </div>
  <div class="pg-label" style="margin-top:16px;">Цель (необязательно)</div>
  <textarea id="purpose" placeholder="Например: индивидуальная сессия, группа..."></textarea>
  <div class="hint">Эту информацию увидят участники группы</div>
</div>

<!-- STEP 3: CONFIRM -->
<div class="pg" id="pg3">
  <div class="pg-label">Шаг 4 — Подтверждение</div>
  <div class="sum-card">
    <div class="sum-header">Детали бронирования</div>
    <div class="sum-row">
      <div class="sum-ico">🏠</div>
      <div><div class="sum-lbl">Комната</div><div class="sum-val" id="sRoom">—</div></div>
    </div>
    <div class="sum-row">
      <div class="sum-ico">📅</div>
      <div><div class="sum-lbl">Дата</div><div class="sum-val" id="sDate">—</div></div>
    </div>
    <div class="sum-row">
      <div class="sum-ico">⏰</div>
      <div><div class="sum-lbl">Время</div><div class="sum-val" id="sTime">—</div></div>
    </div>
    <div class="sum-row" id="sPurposeRow" style="display:none">
      <div class="sum-ico">📝</div>
      <div><div class="sum-lbl">Цель</div><div class="sum-val" id="sPurpose">—</div></div>
    </div>
  </div>
  <div class="hint" style="font-size:13px;">
    После подтверждения бронь появится в группе.
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bar">
  <button class="btn btn-s" id="btnBack" onclick="back()" style="display:none">←</button>
  <button class="btn btn-p" id="btnNext" onclick="next()">Далее →</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const ROOMS_DEF = [
  {id:3, name:"Комната 3", type:"Большая аудитория",   icon:"large"},
  {id:5, name:"Комната 5", type:"Средняя",              icon:"medium"},
  {id:1, name:"Комната 1", type:"Индивидуальная",       icon:"small"},
  {id:2, name:"Комната 2", type:"Индивидуальная",       icon:"small"},
  {id:4, name:"Комната 4", type:"Индивидуальная",       icon:"small"},
];

const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let step = 0;
let selRoom = null;
let selDate = null;
let bookings = [];
let calYear, calMonth;

const now = new Date();
calYear  = now.getFullYear();
calMonth = now.getMonth();

// ── LOAD BOOKINGS ─────────────────────────────────────────────
async function loadBookings(date) {
  try {
    const r = await fetch(`/api/bookings?date=${date}`);
    return await r.json();
  } catch(e) { return []; }
}

// ── RENDER ROOMS ──────────────────────────────────────────────
async function renderRooms() {
  const today = now.toISOString().slice(0,10);
  bookings = await loadBookings(today);

  const list = document.getElementById('roomList');
  list.innerHTML = '';
  ROOMS_DEF.forEach(r => {
    const busy = bookings.filter(b => b.room === r.id);
    const isBusy = busy.length > 0;

    const el = document.createElement('div');
    el.className = 'room-card' + (selRoom === r.id ? ' sel' : '');
    el.dataset.id = r.id;
    el.innerHTML = `
      <div class="room-num">${r.id}</div>
      <div class="room-info">
        <div class="room-name">${r.name}</div>
        <div class="room-type">${r.type}</div>
        <div class="room-dot ${isBusy?'busy':'free'}">
          ${isBusy ? '● Занята сейчас' : '● Свободна'}
        </div>
      </div>
      <div class="room-check">${selRoom===r.id?'✓':''}</div>`;
    el.onclick = () => {
      selRoom = r.id;
      renderRooms();
      document.getElementById('btnNext').disabled = false;
    };
    list.appendChild(el);
  });
}

// ── RENDER CALENDAR ───────────────────────────────────────────
function renderCal() {
  document.getElementById('monthTitle').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const cal = document.getElementById('cal');
  cal.innerHTML = DAYS.map(d=>`<div class="cal-lbl">${d}</div>`).join('');

  const first = new Date(calYear, calMonth, 1);
  let startDow = first.getDay();
  if(startDow === 0) startDow = 7;
  for(let i=1; i<startDow; i++) cal.innerHTML += `<div class="cal-day empty"></div>`;

  const days = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = now.toISOString().slice(0,10);

  for(let d=1; d<=days; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPast  = dateStr < todayStr;
    const isToday = dateStr === todayStr;
    const isSel   = dateStr === selDate;
    const el = document.createElement('div');
    el.className = 'cal-day' + (isPast?' past':'') + (isToday?' today':'') + (isSel?' sel':'');
    el.textContent = d;
    el.onclick = () => { selDate = dateStr; renderCal(); };
    cal.appendChild(el);
  }
}

function changeMonth(dir){
  calMonth += dir;
  if(calMonth > 11){ calMonth=0; calYear++; }
  if(calMonth < 0) { calMonth=11; calYear--; }
  renderCal();
}

// ── STEPS ─────────────────────────────────────────────────────
function showStep(s){
  document.querySelectorAll('.pg').forEach((p,i)=>p.classList.toggle('on',i===s));
  ['d0','d1','d2','d3'].forEach((id,i)=>{
    const el = document.getElementById(id);
    el.classList.remove('on','done');
    if(i<s) el.classList.add('done');
    else if(i===s) el.classList.add('on');
  });
  document.getElementById('btnBack').style.display = s>0?'':'none';
  const nextBtn = document.getElementById('btnNext');
  if(s===3){ nextBtn.textContent = '✓ Подтвердить'; }
  else      { nextBtn.textContent = 'Далее →'; }
}

async function next(){
  const err = document.getElementById('timeErr');
  err.classList.remove('on');

  if(step===0){
    if(!selRoom) return;
    selDate = now.toISOString().slice(0,10);
    renderCal();
    step=1; showStep(1); return;
  }

  if(step===1){
    if(!selDate) return;
    // Load bookings for selected date
    bookings = await loadBookings(selDate);
    step=2; showStep(2); return;
  }

  if(step===2){
    const s = document.getElementById('tStart').value;
    const e = document.getElementById('tEnd').value;
    if(!s||!e){ err.textContent='Укажите время.'; err.classList.add('on'); return; }
    if(e<=s){ err.textContent='Время окончания должно быть позже начала.'; err.classList.add('on'); return; }

    // Check conflict locally
    const conflict = bookings.find(b => b.room===selRoom && !(e<=b.start || s>=b.end));
    if(conflict){
      err.textContent=`Комната занята: ${conflict.name}, ${conflict.start}–${conflict.end}`;
      err.classList.add('on'); return;
    }

    // Fill summary
    const rDef = ROOMS_DEF.find(r=>r.id===selRoom);
    document.getElementById('sRoom').textContent = rDef ? `${rDef.name} (${rDef.type})` : selRoom;
    document.getElementById('sDate').textContent = formatDate(selDate);
    document.getElementById('sTime').textContent = `${s} – ${e}`;
    const pur = document.getElementById('purpose').value.trim();
    if(pur){
      document.getElementById('sPurpose').textContent = pur;
      document.getElementById('sPurposeRow').style.display = '';
    } else {
      document.getElementById('sPurposeRow').style.display = 'none';
    }
    step=3; showStep(3); return;
  }

  if(step===3){
    const s = document.getElementById('tStart').value;
    const e = document.getElementById('tEnd').value;
    const p = document.getElementById('purpose').value.trim();
    tg.sendData(JSON.stringify({
      room: selRoom,
      date: selDate,
      start_time: s,
      end_time: e,
      purpose: p
    }));
  }
}

function back(){
  if(step>0){ step--; showStep(step); }
}

function formatDate(d){
  const [y,m,day] = d.split('-');
  return `${day}.${m}.${y}`;
}

// ── INIT ──────────────────────────────────────────────────────
document.getElementById('btnNext').disabled = true;
renderRooms();
</script>
</body>
</html>
